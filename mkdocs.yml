site_name: pyTorchAutoForge
site_description: PyTorchAutoForge documentation
site_url: https://petercalifano.github.io/pyTorchAutoForge/
repo_url: https://github.com/PeterCalifano/pyTorchAutoForge
repo_name: PeterCalifano/pyTorchAutoForge
docs_dir: doc
site_dir: site

use_directory_urls: true

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Testing: testing.md
  - API Reference:
      - Overview: api/index.md
      - Root Package: api/root.md
      - API: api/api.md
      - Datasets: api/datasets.md
      - Evaluation: api/evaluation.md
      - Hparams Optim: api/hparams_optim.md
      - Model Building: api/model_building.md
      - Optimization: api/optimization.md
      - Setup: api/setup.md
      - Utils: api/utils.md
      - Monitoring: api/monitoring.md
  - Development:
      - Roadmap: roadmap.md

theme:
  name: material
  logo: assets/ptaf_logo_small.jpg
  favicon: assets/ptaf_logo_small.jpg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            docstring_options:
              warnings: false
              warn_unknown_params: false
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
